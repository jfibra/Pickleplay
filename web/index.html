    <style>
        :root {
            --brand-lime: #a3e635;
            --brand-blue: #2563eb;
        }

        /* Fluid root font-size: scales all rem-based values proportionally.
           Mobile/tablet: 16px (standard). Laptop 125%: ~16.3px. Laptop 100%: ~16.9px. 4K: ~18px. */
        html {
            font-size: clamp(16px, calc(14px + 0.15vw), 18px);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* App handles scrolling internally in 'main' */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Utility to hide scrollbars */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            display: flex;
            width: 200%;
            animation: marquee 30s linear infinite;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .text-gradient {
            background: linear-gradient(to bottom right, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-pattern {
            background-image: radial-gradient(#2563eb11 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Shimmer Animation */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #f1f5f9 4%, #e2e8f0 25%, #f1f5f9 36%);
            background-size: 1000px 100%;
        }

        /* 3D Flip Styles */
        .perspective-1000 {
            perspective: 2000px;
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .flip-card-inner {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Fixed Fade-In to prevent fixed position trapping */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0.4;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {

        }

        .animate-route-transition {
            animation: slideUpFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

<body class="h-full w-full">
    <div id="root" class="h-full w-full"></div>

    <!--
      PRE-BUNDLE RECOVERY FLAG CAPTURE
      This plain (non-module) script runs BEFORE the Vite bundle (index.tsx) loads.
      Supabase's createClient() clears the URL hash when it processes auth tokens,
      so this is the ONLY place we can reliably read the 'type=recovery' flag.
    -->
    <script>
      (function () {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        if (hash.indexOf('type=recovery') !== -1 || search.indexOf('type=recovery') !== -1) {
          sessionStorage.setItem('password_recovery_pending', 'true');
        }
      })();
    </script>

    <script type="module" src="/index.tsx"></script>
</body>
